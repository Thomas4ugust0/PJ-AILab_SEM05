name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  # --- BACKEND ---
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install flake8 && flake8 backend/

  build-backend:
    needs: lint-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t backend:test -f backend/Dockerfile backend/

  test-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Backend Tests
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml up -d db
          docker compose -f docker-compose.yml build backend
          docker compose -f docker-compose.yml run backend python manage.py test

  # --- FRONTEND ---
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint

  build-frontend:
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build

  test-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run test

  deploy-backend:
    needs: test-backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and Push Backend
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$REPO-backend:latest -t ghcr.io/$REPO-backend:${{ github.sha }} -f backend/Dockerfile.prod backend/
          docker push ghcr.io/$REPO-backend:latest
          docker push ghcr.io/$REPO-backend:${{ github.sha }}

  deploy-frontend:
    needs: test-frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and Push Frontend
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$REPO-frontend:latest -t ghcr.io/$REPO-frontend:${{ github.sha }} -f frontend/Dockerfile.prod frontend/
          docker push ghcr.io/$REPO-frontend:latest
          docker push ghcr.io/$REPO-frontend:${{ github.sha }}

  deploy-firebase-preview:
    needs: test-frontend
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency: 
      group: firebase-preview-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && STATIC_EXPORT=true NEXT_PUBLIC_DATA_SOURCE=firestore NEXT_PUBLIC_USE_EMULATOR=false npm run build
      - id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PJ_AILAB_SEM06_65D6F }}
          projectId: pj-ailab-sem06-65d6f
      - name: Teste de fumaca
        run: |
          URL=$(echo "${{ steps.firebase_deploy.outputs.urls }}" | awk -F',' '{print $1}')
          echo "Testando URL: $URL"
          curl --fail "$URL"

  deploy-firebase-prod:
    needs: test-frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: 
      group: firebase-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && STATIC_EXPORT=true NEXT_PUBLIC_DATA_SOURCE=firestore NEXT_PUBLIC_USE_EMULATOR=false npm run build
      - id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PJ_AILAB_SEM06_65D6F }}
          projectId: pj-ailab-sem06-65d6f
          channelId: live
      - name: Teste de fumaca
        run: |
          URL=$(echo "${{ steps.firebase_deploy.outputs.urls }}" | awk -F',' '{print $1}')
          echo "Testando URL: $URL"
          curl --fail "$URL"
